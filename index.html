khi đời quá gắt."],moon:["Cảm xúc đến nhanh, nóng và đi cũng nhanh. Bồ cần được tự do hành động ngay khi có hứng; bị kìm là bực. An toàn với bồ là được tự quyết.","Bồ cần sự ổn định, nhịp sống đều, đồ ăn ngon, cái ôm thật. Cảm xúc bền và chậm đổi; khi căng thẳng bồ bám vào cái quen và ngại thay đổi.","Bồ xử lý cảm xúc bằng cách nói ra hoặc viết ra. Cần được trò chuyện và kích thích trí óc; tâm trạng đổi nhanh, dễ bồn chồn khi buồn chán.","Mặt Trăng ở đúng cung nhà của nó: cảm xúc sâu, trí nhớ tình cảm mạnh, bản năng chăm sóc lớn. Cần một mái nhà an toàn; dễ tủi và giữ chuyện cũ.","Bồ cần được chú ý, khen ngợi và yêu thương rõ ràng. Tình cảm ấm, rộng rãi, có chút kịch tính; tự ái cao khi thấy mình bị xem nhẹ.","Bồ thấy yên khi mọi thứ ngăn nắp và mình có ích. Thể hiện tình cảm bằng việc làm cụ thể; hay lo, hay tự soi lỗi, khó thả lỏng.","Bồ cần hòa khí và có người đồng hành. Dịu, biết điều; sợ xung đột nên hay nén cảm xúc thật để giữ yên, rồi mất cân bằng bên trong.","Cảm xúc cực sâu và ít khi lộ hết. Bồ cần sự tin tưởng tuyệt đối; đã thương là hết mình, bị phản bội thì rất khó quên.","Bồ cần không gian, tự do và niềm vui. Lạc quan, mau vui lại; khi buồn thường muốn đi đâu đó hoặc tìm ý nghĩa thay vì ngồi với nỗi buồn.","Bồ kìm cảm xúc và tự lo cho mình từ sớm. Cần cảm giác kiểm soát và thành tựu để thấy an toàn; khó nhờ vả, khó cho phép mình yếu.","Bồ quan sát cảm xúc từ xa như một nhà nghiên cứu. Cần tự do và tình bạn; trung thành theo kiểu riêng, nhưng người khác có thể thấy bồ lạnh.","Bồ hút cảm xúc của cả căn phòng như miếng bọt biển. Giàu trắc ẩn, mơ mộng; cần thời gian một mình để xả, nếu không sẽ kiệt."],mercury:["Nghĩ nhanh, nói thẳng, quyết liền. Giỏi tranh luận và khởi ý tưởng; dễ nói trước khi nghĩ hết.","Nghĩ chậm, chắc, thực tế. Đã hiểu là nhớ lâu; khó đổi ý và không thích lý thuyết suông.","Đầu óc nhanh như chớp, hóm, đa nhiệm. Học cái gì cũng vào nhưng dễ dừng ở bề mặt.","Nghĩ bằng cảm xúc và trí nhớ. Nói năng mềm, nhớ dai chi tiết về người; nhận định dễ nhuốm tâm trạng.","Nói có sức hút, thích kể chuyện và trình bày. Tự tin vào ý mình; đôi khi khó nghe ý trái.","Phân tích sắc, chính xác, có hệ thống. Viết và biên tập giỏi; dễ sa vào chi tiết và tự phê bình.","Cân nhắc nhiều chiều, nói khéo, giỏi thương lượng. Khó chốt vì luôn thấy lý của phía bên kia.","Tư duy thám tử: đào sâu, đọc ẩn ý, giữ bí mật. Lời nói sắc; có thể đa nghi.","Nghĩ bức tranh lớn, thích triết lý và ngoại ngữ. Nói thật đến mức vụng; hay bỏ sót chi tiết.","Tư duy có cấu trúc, thực dụng, nói ít mà chắc. Giỏi lập kế hoạch; có thể bi quan.","Ý tưởng độc, logic, đi trước thời. Thích tranh luận khái niệm; cố chấp với quan điểm đã chọn.","Nghĩ bằng hình ảnh và trực giác. Giàu tưởng tượng, hợp nghệ thuật; khó diễn đạt mạch lạc và hay quên chi tiết."],venus:["Yêu nhanh, thích chinh phục, bày tỏ trực tiếp. Cần mối quan hệ có lửa; dễ chán khi mọi thứ quá êm.","Yêu bằng giác quan và sự bền bỉ: đồ ăn, cái chạm, quà thật. Chung thủy, cần an toàn; có thể chiếm hữu.","Yêu bằng trò chuyện. Cần người nói chuyện hợp và sự mới mẻ; tình cảm nhẹ nhàng, khó đoán.","Yêu là chăm sóc và xây tổ ấm. Dịu dàng, gắn bó; dễ tổn thương và cần được trấn an.","Yêu hào phóng, lãng mạn kiểu lớn, muốn được trân trọng công khai. Trung thành; cần được ngưỡng mộ.","Thể hiện tình cảm qua việc giúp đỡ thiết thực. Kén chọn, khiêm tốn; hay soi chỗ chưa hoàn hảo ở mình và người.","Sao Kim ở cung nhà: duyên, lịch thiệp, coi trọng sự công bằng trong tình cảm. Cần có đôi; ngại va chạm.","Yêu là tất cả hoặc không. Đam mê, gắn bó sâu, cần sự thật tuyệt đối; dễ ghen và thử lòng.","Yêu tự do và phiêu lưu. Cần người cùng đi, cùng cười, cùng lớn; ngại bị trói.","Yêu nghiêm túc, chậm mở lòng nhưng bền. Thể hiện bằng trách nhiệm; có thể giữ kẽ và đặt việc lên trước.","Yêu như bạn thân. Cần không gian riêng và sự kết nối trí tuệ; không hợp khuôn mẫu truyền thống.","Yêu vô điều kiện, lãng mạn, hy sinh. Thấy điều đẹp nhất ở người kia; dễ lý tưởng hóa và quên ranh giới."],mars:["Hành động tức thì, cạnh tranh, can đảm. Nóng nhanh nguội nhanh; mạnh ở khởi động hơn là kéo dài.","Chậm khởi động nhưng đã chạy là không dừng. Sức bền lớn; giận lâu mới bùng và rất lì.","Đánh bằng lời và ý tưởng. Làm nhiều việc một lúc, nhanh trí; năng lượng dễ tản.","Hành động theo cảm xúc và để bảo vệ người thân. Giận kiểu gián tiếp, dỗi; kiên trì âm thầm.","Làm gì cũng hết mình và có khí thế. Muốn dẫn đầu, tự hào; va chạm khi cái tôi bị đụng.","Dồn sức vào việc cụ thể, làm kỹ, hiệu quả. Bực vì tiểu tiết; hay phê bình khi căng thẳng.","Hành động sau khi cân nhắc, đấu tranh vì công bằng. Né xung đột trực diện; đôi lúc chần chừ.","Ý chí thép, chiến lược, không bỏ cuộc. Giận ngầm và nhớ lâu; sức tập trung đáng nể.","Hành động vì niềm tin và phiêu lưu. Hăng, thẳng, thích mục tiêu lớn; bắt đầu nhiều hơn kết thúc.","Tham vọng có kỷ luật, leo từng bậc. Kiểm soát cơn giận tốt; có thể lạnh và quá coi trọng thành tích.","Hành động theo cách riêng, vì lý tưởng hoặc tập thể. Nổi loạn với mệnh lệnh; năng lượng thất thường.","Hành động theo cảm hứng và trực giác. Mạnh khi làm vì người khác hoặc nghệ thuật; dễ thụ động và né xung đột."],jupiter:["May mắn đến khi bồ dám đi trước và tin vào mình.","Lớn lên qua sự kiên trì và biết hưởng thụ; có duyên với tiền bạc vật chất.","Mở rộng nhờ học hỏi, viết lách, quan hệ rộng.","Phúc đến từ gia đình và lòng tốt; càng chăm sóc người khác càng được.","Lớn nhờ sáng tạo, tự tin và lòng hào phóng.","Cơ hội đến qua sự chỉn chu, tay nghề và việc giúp người.","May mắn qua đối tác, hợp tác và sự công bằng.","Lớn lên qua những lần đào sâu, khủng hoảng và nguồn lực chung.","Sao Mộc ở cung nhà: duyên với du lịch, học cao, nước ngoài; lạc quan bẩm sinh.","Thành công đến chậm, nhờ kỷ luật và uy tín.","Cơ hội qua mạng lưới bạn bè, công nghệ, ý tưởng mới.","Được che chở qua lòng trắc ẩn, nghệ thuật, tâm linh."],saturn:["Bài học: dám khẳng định mình mà không sợ sai; sự tự tin phải tự xây.","Bài học về an toàn vật chất và giá trị bản thân; nỗi sợ thiếu thốn.","Bài học về lời nói và học hành; sợ mình chưa đủ giỏi nên học rất kỹ.","Bài học về cảm xúc và gia đình; khó mở lòng, tự làm chỗ dựa cho mình.","Bài học về thể hiện bản thân; sợ bị chê, phải học vui chơi và tỏa sáng.","Bài học về sự hoàn hảo; làm việc rất nghiêm, dễ lo và tự ép.","Bài học về cam kết và công bằng trong quan hệ; chín chắn trong tình cảm.","Bài học về tin tưởng, kiểm soát và buông bỏ.","Bài học về niềm tin; phải tự kiểm chứng chân lý của mình.","Sao Thổ ở cung nhà: tham vọng, kỷ luật, gánh trách nhiệm sớm.","Bài học về cá tính trong tập thể; kỷ luật trong ý tưởng.","Bài học về ranh giới; phân biệt lòng tốt với hy sinh vô lối."],asc:["Bồ bước vào đâu cũng nhanh, trực diện, đầy năng lượng. Ấn tượng đầu: tự tin, hơi nóng vội.","Ấn tượng đầu: điềm, dễ chịu, đáng tin. Bồ tiếp cận mọi thứ chậm rãi và chắc chắn.","Ấn tượng đầu: lanh lợi, nói nhiều, trẻ hơn tuổi. Bồ tiếp cận đời bằng câu hỏi.","Ấn tượng đầu: dịu, kín, hơi dè dặt. Bồ dò cảm xúc của không gian trước khi mở lòng.","Ấn tượng đầu: nổi bật, ấm, có khí chất. Bồ bước vào là có mặt.","Ấn tượng đầu: gọn gàng, khiêm tốn, quan sát. Bồ để ý chi tiết trước khi lên tiếng.","Ấn tượng đầu: duyên, dễ mến, hòa nhã. Bồ tự động làm cầu nối giữa mọi người.","Ấn tượng đầu: bí ẩn, ánh nhìn mạnh, khó đoán. Bồ quan sát kỹ và không lộ bài.","Ấn tượng đầu: cởi mở, vui, thẳng. Bồ tiếp cận đời như một chuyến đi.","Ấn tượng đầu: nghiêm túc, chững chạc, đáng tin. Bồ dè dặt lúc đầu, càng lớn càng thoải mái.","Ấn tượng đầu: khác người, thân thiện nhưng giữ khoảng cách. Bồ có góc nhìn riêng.","Ấn tượng đầu: mềm, mơ màng, dễ gần. Bồ thấm không khí xung quanh và đổi theo nó."],mc:["Hợp vai trò tiên phong, tự làm chủ, môi trường cạnh tranh.","Hợp nghề gắn với tài chính, thẩm mỹ, ẩm thực, những thứ bền và có giá trị thật.","Hợp truyền thông, viết, dạy, bán hàng, nghề cần nói và kết nối.","Hợp nghề chăm sóc, giáo dục, nhà cửa, ẩm thực, thương hiệu có tính gia đình.","Hợp sân khấu, sáng tạo, lãnh đạo, thương hiệu cá nhân.","Hợp phân tích, biên tập, y tế, cùng, gắn bó sâu và buông những gì đã hết","muốn đi xa, học lớn, tìm ý nghĩa","muốn có thành tựu, gánh vác và xây vị thế","muốn tự do, có bạn bè, làm khác đi","muốn nghỉ, mơ, chữa lành và khép một chu kỳ"],n0=["Gieo hạt: một chu kỳ gần 30 năm vừa bắt đầu. Bồ hành động theo bản năng, chưa cần thấy rõ đích; điều quan trọng là dám khởi sự.","Vượt quán tính: bồ đang gắng tách khỏi nếp cũ và gom nguồn lực cho hướng mới. Có lực cản, nhưng mỗi bước đều tính.","Hành động: giai đoạn của quyết định lớn và va chạm cần thiết. Bồ dựng khung cho điều mình đã chọn.","Hoàn thiện: bồ chỉnh sửa, học thêm, mài kỹ năng để chuẩn bị cho đỉnh sắp tới.","Đỉnh điểm: những gì gieo từ nhiều năm trước lộ rõ thành quả. Các mối quan hệ lên trung tâm, và bồ thấy rất rõ mình muốn gì.","Lan tỏa: bồ có điều để chia sẻ. Đây là lúc dạy, viết, truyền đạt điều mình đã hiểu.","Xét lại: bên trong đổi hướng trước, bên ngoài theo sau. Bồ bỏ dần những gì không còn đúng với mình.","Khép lại: buông, nghỉ và dọn chỗ. Chu kỳ cũ sắp hết, nên giữ sức cho lần gieo hạt tiếp theo."],n1=["bùng lên ngay rồi nguội nhanh; cần vận động để xả, đừng bắt bồ ngồi yên chịu trận","lì ra, im lặng và bám vào thói quen; ăn uống, ngủ nghỉ là cách bồ tự trấn an","nói liên hồi hoặc nghĩ không ngừng; viết ra giúp bồ hạ nhiệt nhanh nhất","thu mình vào vỏ, dễ tủi và nhớ chuyện cũ; cần một người ôm chứ không cần lời khuyên","tỏ ra ổn và càng làm quá lên; thật ra bồ cần được công nhận rằng mình đang mệt","lao vào dọn dẹp, sửa lỗi, tự trách; cơ thể bồ lên tiếng trước qua dạ dày, giấc ngủ","tìm người để nói và cố giữ hòa khí, nén ý mình xuống; rồi mất cân bằng âm thầm","im lặng, rút sâu, tự xử lý một mình; cảm xúc cuộn rất mạnh bên dưới vẻ bình thản","muốn bỏ đi đâu đó, pha trò cho qua; bồ cần không gian và một ý nghĩa để bám vào","gồng lên làm việc nhiều hơn, tự gánh, không than; dễ kiệt mà chính bồ không nhận ra","tách ra, quan sát như người ngoài, lý trí hóa mọi thứ; cần thời gian ở một mình","trốn vào giấc ngủ, âm nhạc, mơ mộng; bồ hấp thụ cả nỗi buồn của người khác nên cần xả"],n2=["được tự quyết và được thử sức","sự ổn định, yên tâm về vật chất và những điều đẹp đẽ thật","được học, được nói, được đổi mới","một nơi thuộc về và những người để thương","được nhìn thấy, được trân trọng và được sáng tạo","được làm việc có ích và thấy mọi thứ đúng chỗ","sự hòa hợp và một người đồng hành xứng đáng","sự thật, sự gắn bó sâu và quyền tự chủ","tự do, ý nghĩa và chân trời mới","thành tựu, sự tôn trọng và một mục tiêu để leo","được là chính mình và thuộc về một lý tưởng chung","sự kết nối tâm hồn, cái đẹp và khoảng lặng để mơ"],n3=["bị kiểm soát, bị coi là yếu","bị thúc ép thay đổi đột ngột, bị xem nhẹ công sức","bị bắt im lặng, bị cho là hời hợt","bị lạnh nhạt, bị gạt ra ngoài","bị phớt lờ, bị làm mất mặt","bị chê vô dụng, bị xem là khó tính","sự bất công, bị bỏ lại một mình trong xung đột","bị phản bội, bị nói dối","bị giam trong khuôn khổ, bị nghi ngờ thiện ý","bị coi thường năng lực, thất bại công khai","bị ép phải giống người khác","sự phũ phàng, bị lợi dụng lòng tốt"],n4=["thẳng thắn, cho bồ khoảng tự do và đừng lề mề","kiên nhẫn, giữ lời, và nấu cho bồ một bữa ngon","trò chuyện thật nhiều và đừng bắt bồ lặp lại một nhịp","dịu dàng, nhớ những điều nhỏ, hỏi han thật lòng","khen thật lòng, công khai, và để bồ tỏa sáng","giúp bồ việc cụ thể, đúng giờ, đừng bừa bộn","lịch sự, công bằng, đừng to tiếng","thành thật tuyệt đối, đừng dò xét hay giấu giếm","cùng đi, cùng cười, đừng kiểm soát","đáng tin, tôn trọng thời gian và mục tiêu của bồ","tôn trọng sự khác biệt và không gian riêng của bồ","nhẹ nhàng, đừng ép bồ phải rõ ràng ngay lập tức"],n5=["Phong cách khỏe khoắn, màu nổi, đồ thể thao, chọn nhanh và ít cầu kỳ.","Chuộng chất liệu tốt, màu đất, đồ mềm và dễ chịu; thà ít mà xịn.","Trẻ trung, phối đồ linh hoạt, thích phụ kiện nhỏ và hay đổi kiểu.","Mềm mại, hoài cổ, màu sữa, bạc và ngọc trai; thích đồ có kỷ niệm.","Nổi bật, màu vàng ấm, đồ có điểm nhấn và tóc luôn được chăm.","Tối giản, gọn gàng, màu trung tính, từng chi tiết đều sạch sẽ chỉn chu.","Thanh lịch, hài hòa, màu pastel; có gu phối đồ bẩm sinh.","Màu tối, đường cắt sắc, quyến rũ mà kín đáo.","Phóng khoáng, tiện đi lại, pha chút du mục hoặc thể thao.","Cổ điển, chỉn chu, màu trầm; trông đắt tiền dù giản dị.","Phá cách, khác thường, thích món độc lạ hoặc mang hơi công nghệ.","Bay bổng, nhiều lớp mỏng, màu nước biển; hơi mơ màng và nghệ sĩ."],n6=["Nói nhanh, dứt khoát, đi thẳng vào việc.","Giọng trầm, chậm, chắc; nói ít mà có trọng lượng.","Nói nhanh, nhiều, hóm; tay minh họa liên tục.","Giọng mềm, hay kể chuyện kèm cảm xúc.","Giọng ấm, vang, kể chuyện có kịch tính.","Nói rõ, chính xác, hay thêm chi tiết và đính chính.","Nói nhẹ, khéo, hay hỏi lại ý người đối diện.","Nói ít, chậm, từng chữ có sức nặng; nhìn thẳng vào mắt.","Nói to, thẳng, hào hứng, hay cười lớn.","Nói điềm đạm, khô, có cấu trúc; ít lời thừa.","Nói kiểu lập luận, hơi xa cách, hay có ý bất ngờ.","Nói nhẹ, vòng vo, giàu hình ảnh; đôi khi bỏ lửng câu."],n9=["kiếm nhanh, tiêu nhanh, thích tự làm ra tiền bằng sức mình","giữ tiền giỏi, thích tích lũy và mua đồ bền","có nhiều nguồn thu nhỏ, kiếm tiền bằng lời nói và ý tưởng","tiền gắn với cảm giác an toàn, hay để dành cho gia đình","hào phóng, thích tiêu cho niềm vui và hình ảnh","chi li, ghi chép kỹ, kiếm tiền bằng tay nghề","tiêu cho cái đẹp và cho người mình thương, thu nhập hay gắn với hợp tác","kín chuyện tiền, có duyên với đầu tư và nguồn lực chung","rộng tay, tin rằng tiền sẽ đến, tiêu cho trải nghiệm","kỷ luật, xây tài sản chậm mà chắc","thu nhập thất thường, kiếm tiền bằng cách khác người","mơ hồ với tiền, hay cho đi; cần một hệ thống giữ giúp"],n8=["làm nhanh, thích việc gấp và ghét bị giám sát","làm đều, bền, cần môi trường dễ chịu","đa nhiệm, hợp việc nhiều giao tiếp và thay đổi","làm việc bằng sự tận tâm, cần đồng nghiệp như gia đình","làm với niềm tự hào, cần được ghi nhận","tỉ mỉ, có quy trình, là người mọi người dựa vào","hợp làm cùng người khác, cần không khí hòa nhã","tập trung sâu, làm
